<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="utf-8"/>
    <title>Kiosk — Customer Terminal</title>
</head>
<body>
    <h1><span wicket:id="appName">BranchDesk — Kiosk</span></h1>

    <h2>Cash withdrawal</h2>
    <form wicket:id="withdrawForm">
        <label>Amount
            <input type="text" wicket:id="amount"/>
        </label>
        <button type="submit">Withdraw</button>
    </form>

    <p><span wicket:id="result"></span></p>

    <p><a href="../">Home</a></p>
</body>
</html>
